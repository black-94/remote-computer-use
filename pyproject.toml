[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-computer-use"
version = "0.1.0"
description = "Read-only MCP server for discovering and monitoring SSH remote capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Remote Computer Use contributors" }]
dependencies = [
  "asyncssh>=2.21,<3",
  "mcp>=1.26,<2",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
  "watchfiles>=1.1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
]

[project.scripts]
remote-computer-use = "remote_computer_use.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_computer_use"]

[tool.hatch.build.targets.wheel.shared-data]
"config.example.yaml" = "share/remote-computer-use/config.example.yaml"
"schema/remote-computer-use.schema.json" = "share/remote-computer-use/remote-computer-use.schema.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["remote_computer_use"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
